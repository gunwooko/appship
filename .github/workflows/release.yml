name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 bundles npm 10
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test built CLI
        run: node dist/index.js --help
      # Authenticated via npm Trusted Publishing (GitHub OIDC) — no token.
      # Provenance is generated automatically for trusted publishers.
      - run: npm publish --access public
